name: euromni

services:
  postgres:
    image: postgres:16-alpine
    profiles: [cms]
    environment:
      POSTGRES_USER: euromni
      POSTGRES_PASSWORD: ${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}
      POSTGRES_DB: euromni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euromni -d euromni"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cms:
    image: golang:1.23-bookworm
    profiles: [cms]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://euromni:${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}@postgres:5432/euromni?sslmode=disable
      CGO_ENABLED: "1"
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
      PORT: "8081"
      LISTEN_ADDR: "0.0.0.0:8081"
    volumes:
      - .:/workspace:ro,z
    ports:
      - "127.0.0.1::8081"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "go run ./cmd/db-migrate && exec go run ./cmd/cms"]
    restart: unless-stopped

  integration-test:
    image: golang:1.23-bookworm
    profiles: [integration]
    user: "1000:1000"
    working_dir: /workspace
    environment:
      CGO_ENABLED: "1"
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    volumes:
      - .:/workspace:ro,z
    tmpfs:
      - /workspace/.tmp:mode=1777
      - /workspace/.tmp/embedded-postgres:mode=1777
    command:
      - sh
      - -c
      - rm -rf .tmp/postgresql-16-tools && exec go test -p 1 -tags=integration -count=1 ./...

volumes:
  postgres-data:
