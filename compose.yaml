name: euromni

services:
  postgres:
    image: postgres:16-alpine
    profiles: [cms]
    environment:
      POSTGRES_USER: euromni
      POSTGRES_PASSWORD: ${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}
      POSTGRES_DB: euromni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euromni -d euromni"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cms:
    image: golang:1.25-bookworm
    profiles: [cms]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://euromni:${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}@postgres:5432/euromni?sslmode=disable
      EUROMNI_ARTIFACT_DIR: /var/lib/euromni/artifacts
      CGO_ENABLED: "1"
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
      PORT: "8081"
      LISTEN_ADDR: "0.0.0.0:8081"
    volumes:
      - .:/workspace:ro,z
      - module-artifacts:/var/lib/euromni/artifacts
    ports:
      - "127.0.0.1::8081"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "mkdir -p /var/lib/euromni/artifacts && chmod 700 /var/lib/euromni/artifacts && go run ./cmd/db-migrate && exec go run ./cmd/cms"]
    restart: unless-stopped

  integration-test:
    image: golang:1.25-bookworm
    profiles: [integration]
    user: "1000:1000"
    working_dir: /workspace
    environment:
      CGO_ENABLED: "1"
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    volumes:
      - .:/workspace:ro,z
    tmpfs:
      - /workspace/.tmp:mode=1777
      - /workspace/.tmp/embedded-postgres:mode=1777
    command:
      - sh
      - -c
      - rm -rf .tmp/postgresql-16-tools && exec go test -p 1 -tags=integration -count=1 ./...

  prestashop-import:
    image: golang:1.25-bookworm
    profiles: [module-import]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://euromni:${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}@postgres:5432/euromni?sslmode=disable
      EUROMNI_ENVIRONMENT: development
      EUROMNI_ARTIFACT_DIR: /var/lib/euromni/artifacts
      CGO_ENABLED: "1"
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
    volumes:
      - .:/workspace:ro,z
      - module-artifacts:/var/lib/euromni/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - mkdir -p /var/lib/euromni/artifacts && chmod 700 /var/lib/euromni/artifacts && exec go run ./cmd/prestashop-import "$@"
      - prestashop-import

  mailpit:
    image: docker.io/axllent/mailpit:v1.27.8
    profiles: [mail]
    ports:
      - "127.0.0.1::8025"

  mail-worker:
    image: golang:1.25-bookworm
    profiles: [mail]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://euromni:${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}@postgres:5432/euromni?sslmode=disable
      EUROMNI_ENVIRONMENT: development
      EUROMNI_MAIL_SMTP_ADDR: mailpit:1025
      EUROMNI_MAIL_FROM: "Atelier Demo <commandes@localhost>"
      EUROMNI_MAIL_TLS_MODE: none
      EUROMNI_MAIL_POLL_INTERVAL: 1s
      CGO_ENABLED: "1"
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
    volumes:
      - .:/workspace:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["go", "run", "./cmd/mail-worker"]
    restart: unless-stopped

volumes:
  postgres-data:
  module-artifacts:
