name: euromni

services:
  postgres:
    image: postgres:16-alpine
    profiles: [cms]
    environment:
      POSTGRES_USER: euromni
      POSTGRES_PASSWORD: ${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}
      POSTGRES_DB: euromni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euromni -d euromni"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - ./migrations/0001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/0002_seed_example.sql:/docker-entrypoint-initdb.d/002_seed_example.sql:ro
      - ./migrations/0003_cart_access_tokens.sql:/docker-entrypoint-initdb.d/003_cart_access_tokens.sql:ro
      - ./migrations/0004_schema_migrations.sql:/docker-entrypoint-initdb.d/004_schema_migrations.sql:ro
      - ./migrations/0005_seed_second_product.sql:/docker-entrypoint-initdb.d/005_seed_second_product.sql:ro
      - ./migrations/0006_seed_representative_catalog.sql:/docker-entrypoint-initdb.d/006_seed_representative_catalog.sql:ro
      - postgres-data:/var/lib/postgresql/data

  cms:
    image: golang:1.23-alpine
    profiles: [cms]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://euromni:${EUROMNI_DB_PASSWORD:?Set EUROMNI_DB_PASSWORD or configure .env}@postgres:5432/euromni?sslmode=disable
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
      PORT: "8081"
    volumes:
      - .:/workspace:ro
    ports:
      - "127.0.0.1::8081"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "run", "./cmd/cms"]
    restart: unless-stopped

  integration-test:
    image: golang:1.23-alpine
    profiles: [integration]
    user: "1000:1000"
    working_dir: /workspace
    environment:
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    volumes:
      - .:/workspace:ro
    tmpfs:
      - /workspace/.tmp:uid=1000,gid=1000,mode=0700
    command: ["go", "test", "-tags=integration", "-count=1", "./..."]

volumes:
  postgres-data:
