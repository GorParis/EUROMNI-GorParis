name: CMS standalone distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "cms-v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-amd64
          - os: windows-2022
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Rust guest target
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown

      - name: Inspect and execute Rust guest
        run: go test -tags=wasmtoolchain -count=1 ./internal/wasm -run '^TestRustUnknownUnknownGuestImportsOnlyEuromniCallAndExecutes$'

      - name: Set up Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Install PostgreSQL 16 client from PGDG
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16

      - name: PostgreSQL integration tests
        run: go test -p 1 -tags=integration -count=1 ./...

      - name: Build and archive Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle="euromni-cms-${{ matrix.target }}"
          mkdir -p "dist/$bundle/docs"
          for command in cms db-migrate db-backup staff-bootstrap artifact-reconciler; do
            go build -trimpath -o "dist/$bundle/euromni-$command" "./cmd/$command"
          done
          cp docs/cms-distribution.md docs/database.md docs/local-postgresql.md "dist/$bundle/docs/"
          {
            printf 'Target: %s\n' '${{ matrix.target }}'
            printf 'Commit: %s\n' "$GITHUB_SHA"
            go version
            go env GOOS GOARCH CGO_ENABLED
          } > "dist/$bundle/BUILD-INFO.txt"
          tar -czf "dist/$bundle.tar.gz" -C dist "$bundle"

      - name: Smoke test extracted Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle="euromni-cms-${{ matrix.target }}"
          smoke_dir="$(mktemp -d)"
          trap 'if [[ -n "${cms_pid:-}" ]]; then kill "$cms_pid" 2>/dev/null || true; wait "$cms_pid" 2>/dev/null || true; fi; rm -rf "$smoke_dir"' EXIT
          tar -xzf "dist/$bundle.tar.gz" -C "$smoke_dir"
          test -x "$smoke_dir/$bundle/euromni-db-backup"
          LISTEN_ADDR=127.0.0.1:18081 "$smoke_dir/$bundle/euromni-cms" >"$smoke_dir/cms.log" 2>&1 &
          cms_pid=$!
          ready=false
          for _ in {1..50}; do
            if curl --fail --silent http://127.0.0.1:18081/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$cms_pid" 2>/dev/null; then
              cat "$smoke_dir/cms.log"
              exit 1
            fi
            sleep 0.2
          done
          if [[ "$ready" != true ]]; then
            cat "$smoke_dir/cms.log"
            echo "Packaged Linux CMS did not become healthy" >&2
            exit 1
          fi
          for path in admin/ v1/products; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:18081/$path")"
            if [[ "$status" != 200 ]]; then
              echo "Packaged Linux CMS returned HTTP $status for /$path" >&2
              exit 1
            fi
          done

      - name: Build and archive Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "euromni-cms-${{ matrix.target }}"
          $bundlePath = Join-Path "dist" $bundle
          $docsPath = Join-Path $bundlePath "docs"
          New-Item -ItemType Directory -Force -Path $docsPath | Out-Null
          foreach ($command in @("cms", "db-migrate", "db-backup", "staff-bootstrap", "artifact-reconciler")) {
            go build -trimpath -o (Join-Path $bundlePath "euromni-$command.exe") "./cmd/$command"
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $command" }
          }
          Copy-Item docs/cms-distribution.md,docs/database.md,docs/local-postgresql.md -Destination $docsPath
          @(
            "Target: ${{ matrix.target }}"
            "Commit: $env:GITHUB_SHA"
            (go version)
            (go env GOOS GOARCH CGO_ENABLED)
          ) | Set-Content -Encoding ascii (Join-Path $bundlePath "BUILD-INFO.txt")
          Compress-Archive -Path $bundlePath -DestinationPath (Join-Path "dist" "$bundle.zip")

      - name: Smoke test extracted Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "euromni-cms-${{ matrix.target }}"
          $smokePath = Join-Path $env:RUNNER_TEMP "euromni-cms-smoke"
          Expand-Archive -LiteralPath (Join-Path "dist" "$bundle.zip") -DestinationPath $smokePath
          if (-not (Test-Path -LiteralPath (Join-Path $smokePath "$bundle\euromni-db-backup.exe") -PathType Leaf)) {
            throw "Packaged Windows db-backup command is missing"
          }
          $cmsPath = Join-Path $smokePath "$bundle\euromni-cms.exe"
          $env:LISTEN_ADDR = "127.0.0.1:18081"
          $process = Start-Process -FilePath $cmsPath -PassThru `
            -RedirectStandardOutput (Join-Path $smokePath "cms.out.log") `
            -RedirectStandardError (Join-Path $smokePath "cms.err.log")
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              if ($process.HasExited) {
                Get-Content (Join-Path $smokePath "cms.err.log")
                throw "Packaged Windows CMS exited with code $($process.ExitCode)"
              }
              try {
                $null = Invoke-WebRequest -Uri "http://127.0.0.1:18081/health" -TimeoutSec 2
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if (-not $ready) {
              Get-Content (Join-Path $smokePath "cms.err.log")
              throw "Packaged Windows CMS did not become healthy"
            }
            foreach ($path in @("admin/", "v1/products")) {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:18081/$path" -TimeoutSec 5
              if ($response.StatusCode -ne 200) {
                throw "Packaged Windows CMS returned HTTP $($response.StatusCode) for /$path"
              }
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
            Remove-Item -LiteralPath $smokePath -Recurse -Force
            Remove-Item Env:LISTEN_ADDR -ErrorAction SilentlyContinue
          }

      - name: Upload distribution archive
        uses: actions/upload-artifact@v4
        with:
          name: euromni-cms-${{ matrix.target }}
          path: dist/euromni-cms-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30
